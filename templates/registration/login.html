{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="{% static 'css/alumnos/alumnos.css' %}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="card max-w-sm w-full p-8">
    <h1 class="text-2xl font-bold text-center text-red-700 mb-6">Iniciar Sesión</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <p class="text-red-600">{{ form.non_field_errors }}</p>
      {% endif %}
      <div>
        <label for="id_username" class="block mb-1 font-medium">Usuario</label>
        <input type="text" name="username" id="id_username" required class="input-field w-full">
      </div>
      <div>
        <label for="id_password" class="block mb-1 font-medium">Contraseña</label>
        <input type="password" name="password" id="id_password" required class="input-field w-full">
      </div>
      <button type="submit" class="btn btn-primary w-full">Entrar</button>
    </form>
  </div>
</body>
</html>
